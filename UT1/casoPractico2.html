<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso Practico 2</title>
</head>
<body>
    <script>
        "use strict";
        let nombre = "";
        let anyoNac = 0;

        nombre = prompt("Introduce tu nombre: ");
        anyoNac = parseInt(prompt("Introduce tu año de nacimiento: "));
        
        const anyoActual = new Date().getFullYear();
        
        let edad = Math.abs(anyoNac - anyoActual);

        alert("Tu nombre es " + nombre + " y tienes " + edad + " años");
    </script>
</body>
</html>
