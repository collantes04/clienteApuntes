<body>
    <script>
        'use strict';
        let lado = parseInt(prompt("Introduce un lado del cuadrado"));
        const perimetro = (4*lado);
        const area = (lado**2);

        alert(`El perímetro es: ${perimetro} cm`);
        alert(`El área es: ${area} cm2`);
    </script>
