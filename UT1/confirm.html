<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salida de datos - confirm()</title>
</head>
<body>
    <script>
        "use strict";
        let respuesta = confirm("¿Estas seguro de eliminar el fichero?");
        
        if(respuesta){
            alert("Has borrado el archivo");
        } else {
            alert("Eliminación cancelada")
        }
    </script>
</body>
</html>
