<body>
    <script>
        "use strict";
        let bachiller = prompt("¿Tienes titulo de bachiller?").toLowerCase();

        if (bachiller === "si") {
            alert("Puedes acceder a un grado superior");
        } else {
            let prueba = prompt("¿Ha hecho la prueba de acceso?").toLowerCase();

            if (prueba === "si") {
                alert("Puedes acceder a un grado superior");
            } else {
                let ciclo = prompt("¿Tienes un titulo de ciclo formativo?").toLowerCase();

                if (ciclo === "si") {
                    alert("Puedes acceder a un grado superior");
                
                } else {
                    alert("No tiene lo necesario para acceder a un grado superior");
                }
            }
        }
    </script>
