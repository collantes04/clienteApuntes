<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividad 2</title>
</head>
<body>
    <p id="p1"></p>
    <p id="p2"></p>

    <script>
        "use strict";
        let provincia = prompt("Introduce tu provincia").toLowerCase();
        let equipo = prompt("Introducde tu equipo de futbol").toLowerCase();

        if(provincia === "cadiz"){
            document.getElementById("p1").innerHTML = "Olé ahí pishita";
        } else {
            document.getElementById("p1").innerHTML = "Hola";
        }

        if(equipo === "cadiz"){
            document.getElementById("p2").innerHTML = "Ánimo colega";
        } else {
            document.getElementById("p2").innerHTML = "Muy bien";
        }
    </script>
</body>
</html>
