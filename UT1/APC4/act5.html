<body>
    <script>
        "use script";
        let n = parseInt(prompt("Introduce un número"));
        let cuenta = [];

        for (let i = n; i >= 0; i--){
            cuenta.push(i);
        }

        alert(`Cuenta atrás\n${cuenta.join(", ")}`);
    </script>
</body>
