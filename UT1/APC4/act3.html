<body>


    <script>
        "use strict";
        const pizza = ["Mozarella", "Tomate"];
        let elect = prompt("Pizza vegetariana (V) o normal (N)").toLowerCase();
        let tipo = "";
        let ingrediente = "";

        if(elect === "v"){
            tipo = "vegetariana";
            pizza.push(prompt(`Ingredientes\n----------\nTofu\nPimiento\n\nIntroduce un ingrediente`));
        } else {
            tipo = "normal";
            pizza.push(prompt(`Ingredientes\n----------\nPeperoni\nJamón\nSalmón\n\nIntroduce un ingrediente`))
        }

        alert(`Pizza ${tipo}\n\n Ingredientes: ${pizza.join(", ")}`);
    </script>
