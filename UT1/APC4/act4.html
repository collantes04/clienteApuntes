<body>
    <script>
        "use strict";
        let a = parseInt(prompt("Introduce el primer lado"));
        let b = parseInt(prompt("Introduce el segundo lado"));
        let c = parseInt(prompt("Introduce el tercer lado"));
        
        if(a === b && b === c){
            alert("Equilatero");
        
        } else if (a != b && b != c && a != c){
            alert("Escaleno");
        } else {
            alert("Isósceles");
        }
    </script>
