<body>
    <script>
        'use strict';

        let palabra = "manzana";
        let lista = palabra.split("");
        let aparece = 0;

        lista.forEach(e => {
            if(e === "a"){
                aparece++;
            }
        });

        alert("La letra a aparece: " + aparece + " veces");
    </script>
</body>
</html>
