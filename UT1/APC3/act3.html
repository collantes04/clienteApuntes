<body>
    <script>
        'use strict';
        function factorial (n){

            if(n===0 || n===1){
                return 1;
            }

            return n * factorial(n-1); 
            //formula del factorial, la recursividad se encarga de la progresion
        }
        let n = parseInt(prompt("Introduce un numero para el factorial"));
        alert(factorial(n));
    </script>
</body>
