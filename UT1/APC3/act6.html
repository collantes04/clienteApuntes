<body>
    <script>
        'use strict';

        let n1 = parseInt(prompt("Introduce el primer numero"));
        let n2 = parseInt(prompt("Introduce el segundo numero"));
        let max = Math.max(n1,n2);
        let min = Math.min(n1,n2);
        let res = 0;
        for (let i = min+1; i < max; i++) {
            res += i;
            
        }
        alert(res);
    </script>
</body>
