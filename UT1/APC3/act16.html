<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jose Antonio Sanchez Collantes - 2ºDAW">
    <title>Actividad 16</title>
</head>
<body>
    <script>
        'use strict';
        let aprobados = 0;
        let suspensos = 0;
        let lista = [];

        for (let i = 0; i < 10; i++) {
            lista.push(parseInt(prompt("Introduce un numero")));
        }

        lista.forEach(e => {
            if(e >= 5){
                aprobados++;
            } else suspensos++
        });
        
        alert(`Aprobados: ${aprobados}\nSuspensos: ${suspensos}`);

    </script>
</body>
</html>
