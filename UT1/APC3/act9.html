<body>
    <p id="p1"></p>
    <script>
        'use strict';
        let cadena = '*';
        let cuadrado = "";

        for (let i = 0; i < 4; i++) {
            cuadrado += cadena.repeat(4) + `<br>`;
        }

        document.getElementById('p1').innerHTML = cuadrado;
    </script>
</body>
