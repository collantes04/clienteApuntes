<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividad 15</title>
</head>
<body>
    <script>
        'use strict';

        let lista = [];
        let tam = parseInt(prompt("Indica el tamaño de la lista"));
        let suma = 0;

        for (let i = 0; i < tam; i++) {
            lista.push(parseInt(prompt("Introduce un numero")));
        }

        lista.forEach(e => {
            suma += e;    
        });

        alert("La media es " + (suma/tam));
        
    </script>
</body>
</html>
