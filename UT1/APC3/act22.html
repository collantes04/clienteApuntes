<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jose Antonio Sanchez Collantes - 2ºDAW">
    <title>Document</title>
</head>
<body>

    <p id="p1"></p>
    <script>
        'use strict';

        const diccionario = {
            "perro" : 'dog',
            'casa' : 'house',
            'gato' : 'cat',
            'comida' : 'food',
            getPalabra(palabra){
                return this[palabra]; //esto busca la clave y retorna el valor del diccionario
            }
        };

        let pal = prompt("Introduce la palabra para traducir");
        
        document.getElementById("p1").innerHTML = `La traducción de ${pal} es: ${diccionario.getPalabra(pal)}`;
    </script>
</body>
</html>
