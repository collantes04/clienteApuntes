<body>
    <script>
        'use strict';
        for (let i = 0; i < 20; i++) {
            if(i%3===0){
                alert(i + " es divisible por 3");
            } else if(i%5===0){
                alert(i + " es divisible por 5");
            } else if (i%5 === 0 && i%3===0){
                alert(i + " es divisible por 3 y por 5");
            } else {
                alert(i + " no es divisible por 3 ni por 5");
            }
            
        }
    </script>
</body>
