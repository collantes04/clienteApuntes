<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function factorial(n){
            let factorial;
            if (factorial === 0){
                return 0;
            }
            for(let i = n; i>n; i--){
                factorial += (i*n);
            }

            return factorial(n-1);
        }
        
        let n = parseInt(prompt("Introduce un numero del factorial"))
        console.log(factorial(n)); 
    </script>
</body>
</html>
