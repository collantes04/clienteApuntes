<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict";
        alert("La operacion 10 == 10 es: " + (10==10));
        alert("La operacion 10 === 10 es: " + (10===10));
        alert("La operación 10 === \"10.0\" es: " + (10==="10.0"));
        alert("La operación \"Borja\" == \'Borja\' es: " + ("Borja" == 'Borja'));
        alert("La operación Borja > borja es: " + ("Borja" > "borja"));
        alert("La operación \"Borja\" < \"borja\" es: " + ("Borja" < "borja"));
        alert("La operación 456 == \"456\" es: " + (456 == "456"));
        alert("La operación \"456\" === \"456\" es: " + ("456" === "456"));
    </script>
</body>
</html>
