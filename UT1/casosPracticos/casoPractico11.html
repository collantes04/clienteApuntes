<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="titulo"></h1>
    <div id="div1"></div>
    <script>
        'use strict';
        let n = parseInt(prompt("Introduce un numero"));
        document.getElementById("titulo").innerHTML = `Tabla del ${n}`;
        let div = document.getElementById("div1");
        for(let i = 1; i<=10; i++){
            let parrafo = document.createElement("p");
            div.appendChild(parrafo).innerHTML = `${n} x ${i} = ${n*i}`;
        }
    </script>
</body>
</html>
