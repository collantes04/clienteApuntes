<body>
    <script>
        "use strict";
        const date = new Date();

        let hora = date.getHours().toString().padStart(2, "0");
        let minuto = date.getMinutes().toString().padStart(2, "0");
        let segundo = date.getSeconds().toString().padStart(2, "0");

        alert(`${hora}:${minuto}:${segundo}`);
    </script>
</body>
</html>
