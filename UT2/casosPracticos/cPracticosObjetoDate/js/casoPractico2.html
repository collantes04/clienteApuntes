<body>
    <script>
        "use strict";
        const date = new Date();
        let dia = date.getDate().toString();
        let mes = String((date.getMonth()+1));
        let anio = date.getFullYear().toString();

        mes.padStart(2, "0");
        dia.padStart(2, "0");
        
        alert(`La fecha es ${dia}/${mes}/${anio}`);
        
    </script>
</body>
</html>
