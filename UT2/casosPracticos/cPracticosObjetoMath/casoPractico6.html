<body>
    <script>
        'use strict';
        let a = parseInt(prompt("Introduce el numero primero"));
        let b = parseInt(prompt("Introduce el numero segundo"));
        let max = Math.max(a,b);
        let min = Math.min(a,b);

        let rand = Math.floor(Math.random()*(max-min+1))+min;

        alert(`El número random entre ${min} y ${max} es: ${rand}`);
    </script>
</body>
</html>
