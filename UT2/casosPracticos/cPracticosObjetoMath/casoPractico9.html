<body>
    <script>
        "use strict";
        let n;

        while(isNaN(n) || n>=0){
            n = parseInt(prompt("Ingresa un número negativo"))

            if(!isNaN(n) && n<0){
                break;

            }
            if (isNaN(n) ? alert("Error ingresa un número válido") : alert("Error el número no es negativo"));
        }

        alert(`El valor absoluto de ${n} es ${Math.abs(n)}`);
    </script>
</body>
</html>
