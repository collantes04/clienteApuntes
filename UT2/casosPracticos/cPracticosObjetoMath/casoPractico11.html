<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caso practico 11</title>
</head>
<body>
    <script>
        "use strict";

        let n;
        while (isNaN(n) || n === "") {
            n = prompt("Ingresa un número de varios dígitos:");

            if (!isNaN(n) && n!== "") {
                break;
            }

            alert("Introduce un número válido");
        }
        
        let arr = n.split("");
        arr = arr.sort();
        
        alert(`El mayor dígito es: ${arr[arr.length-1]}`);
    </script>
</body>
</html>
